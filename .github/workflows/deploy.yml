
name: Django CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  tests:
    name: Run tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: djangorest
          POSTGRES_USER: djangorest
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U djangorest -d djangorest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      SECRET_KEY: ci-test-secret-key-not-for-production
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1

      DB_NAME: djangorest
      DB_USER: djangorest
      DB_PASSWORD: test-password
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"

      CELERY_BROKER_URL: redis://127.0.0.1:6379/0
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/0

      CORS_ALLOWED_ORIGINS: ""
      CSRF_TRUSTED_ORIGINS: ""
      STRIPE_SECRET_KEY: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: poetry install --with dev --no-root --no-interaction --no-ansi

      - name: Django system check
        run: poetry run python manage.py check

      - name: Check migrations
        run: poetry run python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: poetry run python manage.py test

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: tests

    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Deploy over SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_APP_PATH: ${{ secrets.VPS_APP_PATH }}

        run: |
          set -e

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          ssh -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            "set -e
             cd '$VPS_APP_PATH'
             git pull --ff-only origin main
             docker compose build
             docker compose up -d db redis
             docker compose run --rm web python manage.py migrate
             docker compose up -d --force-recreate web celery celery-beat
             docker compose ps"
